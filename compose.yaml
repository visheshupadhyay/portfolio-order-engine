# Compose reads local secrets from ignored .env and injects them only at runtime.
services:
  # Shared in-memory cache. The host port is useful for local redis-cli inspection;
  # the app itself reaches this service by the internal hostname "redis".
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_engine
      POSTGRES_USER: order_engine
      POSTGRES_PASSWORD: "${ORDER_ENGINE_DB_PASSWORD:?Set ORDER_ENGINE_DB_PASSWORD in .env}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_engine -d order_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
    image: portfolio-order-engine:1.0
    ports:
      - "8081:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Compose service names become DNS hostnames on its private network.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_BASE64_SECRET: "${JWT_BASE64_SECRET:?Set JWT_BASE64_SECRET in .env}"
      ORDER_INPUT_FILE: /app/orders.txt
      # "postgres" is the service hostname on Compose's private network, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/order_engine
      DB_USERNAME: order_engine
      DB_PASSWORD: "${ORDER_ENGINE_DB_PASSWORD:?Set ORDER_ENGINE_DB_PASSWORD in .env}"
      OUTBOX_DELIVERY_ENABLED: "false"
      SMS_PROVIDER_BASE_URL: http://localhost:8089
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    # Durable event log used by the outbox worker and independent consumers.
    # One local Kafka broker. It has one internal door for Compose services
    # and one host-facing door for commands run from Windows.
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      # Windows tools use localhost:9092. Compose services use kafka:19092;
      # Kafka must advertise both addresses because clients connect using the
      # address returned in broker metadata after their first connection.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

  kafka-exporter:
    # Translates Kafka topic and consumer-group state (especially lag) into
    # Prometheus metrics. It is monitoring-only; it never consumes messages.
    image: danielqsj/kafka-exporter:v1.10.0
    command:
      - "--kafka.server=kafka:19092"
      - "--kafka.version=4.3.1"
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_started

  prometheus:
    # Pulls metrics from the app and Kafka Exporter on a fixed schedule.
    image: prom/prometheus:v3.13.3
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
  grafana:
    # Displays Prometheus data. Dashboard definitions are mounted read-only from
    # this repository so the useful local dashboard can be reproduced.
    image: grafana/grafana:12.4.11
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
  alert-receiver:
    image: mendhak/http-https-echo:42
    ports:
      - "18080:8080"
# A named volume keeps PostgreSQL data when containers are recreated.
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
