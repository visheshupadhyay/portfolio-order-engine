
order.input-file=src/main/resources/orders.txt

# Local defaults. DB_URL and DB_USERNAME may override this connection.
# DB_PASSWORD has no default and must be supplied outside the repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_engine}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# $env:DB_PASSWORD = "your-postgres-password"

spring.profiles.default=local

# Existing local database already has the V1 schema; record it instead of trying to recreate it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


#Adding values here so that spring will 
#bind them in the code where currently we are using these values hardcoded.
#the benefit of this will be that we can change these values here according to our need
# like in production reshedule pending task take 1 min
#but in test we need it 5 mins . like these changes 
order.outbox.delivery.poll-delay=PT5S
order.outbox.delivery.batch-size=100
order.outbox.delivery.retry-delay=PT1M
order.outbox.delivery.claim-timeout=PT5M
order.outbox.delivery.max-attempts=3


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# SPRING logs format hit mvn test and then you will understand
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-no-request}] %logger{39} -- %msg%n

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db