
order.input-file=src/main/resources/orders.txt

# PostgreSQL connection used by Spring Boot's managed HikariCP pool.
spring.datasource.url=jdbc:postgresql://localhost:5432/order_engine
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# $env:DB_PASSWORD = "your-postgres-password"

# Keep background polling off in tests/local runs; deployment opts in with an environment variable.
order.outbox.delivery.enabled=${OUTBOX_DELIVERY_ENABLED:false}

# Existing local database already has the V1 schema; record it instead of trying to recreate it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1