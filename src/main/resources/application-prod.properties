# Production must provide real connection details outside the repository.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Delivery runs automatically in production unless operations disables it.
order.outbox.delivery.enabled=${OUTBOX_DELIVERY_ENABLED:true}
logging.level.com.vishesh.orderengine.outbox=INFO
logging.level.com.vishesh.orderengine.notification=INFO


management.endpoint.health.show-details=never

notification.sms.provider-base-url=${SMS_PROVIDER_BASE_URL}

# Prometheus is public only to the trusted monitoring network/Compose service.
# /actuator/metrics remains protected by ORDER_ADMIN in SecurityConfiguration.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
