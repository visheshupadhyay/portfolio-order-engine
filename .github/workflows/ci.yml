name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      # Safe throwaway values used only by the temporary CI machine.
      ORDER_ENGINE_DB_PASSWORD: ci-postgres-password
      DB_URL: jdbc:postgresql://localhost:5432/order_engine
      DB_USERNAME: order_engine
      DB_PASSWORD: ci-postgres-password
      JWT_BASE64_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      # Required only because Docker Compose validates the Grafana service config.
      # Grafana itself is not started in this CI workflow.
      GRAFANA_ADMIN_PASSWORD: ci-only-not-a-real-password

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Java 21 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            notification-service/pom.xml

      - name: Confirm Docker is available
        run: docker version

      - name: Start PostgreSQL, Redis, and Kafka for tests
        run: docker compose up -d --wait postgres redis kafka

      - name: Run the complete test suite
        run: mvn -B test

      - name: Run Notification Service tests
        working-directory: notification-service
        run: mvn -B test

      - name: Run Notification Service SpotBugs static analysis
        working-directory: notification-service
        run: mvn -B spotbugs:check

      - name: Run SpotBugs static analysis
        run: mvn -B spotbugs:check
      
      - name: Build the Docker image
        run: docker build --tag portfolio-order-engine:ci .

      - name: Build the Notification Service Docker image
        run: docker build --tag portfolio-notification-service:ci ./notification-service

      - name: Show service logs if tests fail
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up temporary services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Node.js 24 and cache npm dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Check frontend code quality
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        run: npm run build
