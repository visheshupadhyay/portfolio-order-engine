spring.application.name=notification-service
server.port=8082

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Notification Service owns this separate database.
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notification_service}
spring.datasource.username=${DB_USERNAME:order_engine}
spring.datasource.password=${DB_PASSWORD}

# Local Notification Service reaches the Compose Kafka broker through the host.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

notification.kafka.order-paid-topic=order-paid
notification.kafka.consumer-group=order-notification-service
notification.sms.provider-base-url=${SMS_PROVIDER_BASE_URL:http://localhost:8089}
notification.sms.request-timeout=PT3S

# Circuit breaker for the external SMS provider.
resilience4j.circuitbreaker.instances.smsProvider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.smsProvider.sliding-window-size=4
resilience4j.circuitbreaker.instances.smsProvider.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.smsProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.smsProvider.wait-duration-in-open-state=PT2S
resilience4j.circuitbreaker.instances.smsProvider.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.smsProvider.automatic-transition-from-open-to-half-open-enabled=true

# At most five real SMS provider calls may run at the same time.
# A full bulkhead rejects immediately, allowing Kafka retry/DLT to handle it later.
resilience4j.bulkhead.instances.smsProvider.max-concurrent-calls=5
resilience4j.bulkhead.instances.smsProvider.max-wait-duration=PT0S